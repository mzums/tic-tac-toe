{% extends "base.html" %}

{% block title %}Game Result{% endblock %}

{% block content %}
<div class="result-card card">
    <div class="card-body">
        <h2 class="text-center mb-4">
            <i class="fas fa-chess-board"></i> Game Analysis Result
        </h2>
        
        <div class="alert alert-success text-center">
            <h4 class="alert-heading">
                <i class="fas fa-lightbulb"></i> Recommended Move
            </h4>
            <p class="mb-0">
                Best move for <strong class="text-uppercase">{{ player }}</strong>:
                <span class="badge bg-primary fs-5">Row {{ move[0] }}, Column {{ move[1] }}</span>
            </p>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="fas fa-image"></i> Original Board
                    </div>
                    <div class="card-body">
                        <img src="{{ url_for('static', filename='uploads/' + original) }}" 
                             class="game-image img-fluid">
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="fas fa-drafting-compass"></i> AI Suggestion
                    </div>
                    <div class="card-body">
                        <img src="{{ url_for('static', filename='uploads/' + result) }}" 
                             class="game-image img-fluid">
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-custom">
                <i class="fas fa-redo"></i> New Analysis
            </a>
        </div>
    </div>
</div>
{% endblock %}
